<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yolanda | Reports</title><link rel="stylesheet" href="portal.css"><style>.portal h1,.portal h2{transform:translateZ(18px);text-shadow:0 7px 25px #000,0 0 22px #ff238f18}.portal .auth .card{transform-style:preserve-3d;animation:authFloat 5s ease-in-out infinite}@keyframes authFloat{50%{transform:translateY(-7px) rotateX(1deg)}}</style></head><body class="portal app"><header><a class="brand" href="index.html">YOLANDA<span>.</span></a><nav><a href="dashboard.html">Dashboard</a><button data-out>Sign out</button></nav></header><main><div class="heading"><div><small>EMPLOYEE WORKSPACE</small><h1>Profile & Reports</h1></div><a class="btn" href="dashboard.html">Dashboard →</a></div><div class="two"><section class="card"><small>PROFILE</small><h2>Your information</h2><form id="profileForm" class="grid"><label>Full Name<input name="name" id="pname"></label><label>Email<input name="email" id="pemail" type="email"></label><label>Phone<input name="phone" id="pphone"></label><label>Department<select name="department" id="pdepartment"><option>Call Center</option><option>Hospitality</option><option>Sales</option><option>Operations</option></select></label><label>Role<input name="role" id="prole"></label><label>Profile Picture<input type="file" accept="image/*"></label><button class="btn" type="submit">Save Profile</button></form></section><section class="card"><small>YOLANDA REPORTING</small><h2>New Work Report</h2><form id="reportForm"><div class="grid"><label>Report Type<select name="report_type"><option>Call Report</option><option>Message Report</option><option>General Operations</option></select></label><label>Shift / Date<input name="report_date" type="date" required></label></div><h3>YOLANDA CALL REPORT SUMMARY</h3><div class="metrics"><label>Leads to Income<input name="leads_to_income" type="number" min="0"></label><label>Total Number Called<input name="total_number_called" type="number" min="0"></label><label>Total Spoken To<input name="total_spoken_to" type="number" min="0"></label><label>Income Gotten (₦)<input name="income_gotten" type="number" min="0"></label><label>Total Not Spoken To / Not Reachable<input name="not_reachable" type="number" min="0"></label><label>Line Busy<input name="line_busy" type="number" min="0"></label><label>Total Switched Off<input name="switched_off" type="number" min="0"></label><label>Wrong Number<input name="wrong_number" type="number" min="0"></label><label>Duplicate Numbers<input name="duplicate_numbers" type="number" min="0"></label><label>SMS Sent<input name="sms_sent" type="number" min="0"></label></div><h3>YOLANDA MESSAGE REPORT</h3><div class="metrics"><label>Total Number Engaged<input name="total_number_engaged" type="number" min="0"></label><label>Total Messages Sent<input name="total_messages_sent" type="number" min="0"></label><label>Duplicate Information<input name="duplicate_information" type="number" min="0"></label><label>Handles Not Found<input name="handles_not_found" type="number" min="0"></label></div><label>Observations / Summary / Blockers / Accomplishments<textarea name="observations" rows="5"></textarea></label><label>Attachment (PDF/CSV/Images)<input name="attachment" type="file" accept=".pdf,.csv,image/*"></label><button class="btn" type="submit">Submit Report →</button><span id="reportMsg"></span></form></section></div></main><script src="portal.js"></script></body></html>
